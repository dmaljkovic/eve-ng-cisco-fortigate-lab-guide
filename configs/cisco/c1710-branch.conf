hostname BRANCH
no ip domain-lookup
!
! Interface name on the 1710 may be FastEthernet0 or FastEthernet0/0.
! Verify with: show ip interface brief
!
interface FastEthernet0
 description TO-CORE-VLAN30
 ip address 10.30.0.2 255.255.255.0
 no shutdown
!
! Stand-in for the branch LAN. Replace with a real LAN interface if the
! 1710's integrated switch ports are available.
!
interface Loopback0
 description BRANCH-LAN-STANDIN
 ip address 10.31.0.1 255.255.255.0
!
ip route 0.0.0.0 0.0.0.0 10.30.0.1
!
! Core additions:
! interface FastEthernet0/1.30
!  encapsulation dot1Q 30
!  ip address 10.30.0.1 255.255.255.0
! ip route 10.31.0.0 255.255.255.0 10.30.0.2
!
! FortiGate addition:
! config router static
!     edit 4
!         set dst 10.31.0.0 255.255.255.0
!         set gateway 10.0.0.2
!         set device "port2"
!     next
! end
!
end
write memory
