hostname CORE-IOL
no ip domain-lookup
ip routing
service dhcp
!
interface Ethernet0/0
 description TO-FGT
 ip address 10.0.0.2 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 description TO-SW1-TRUNK
 no ip address
 no shutdown
!
interface Ethernet0/1.10
 description VLAN10-USERS
 encapsulation dot1Q 10
 ip address 10.10.0.1 255.255.255.0
!
interface Ethernet0/1.20
 description VLAN20-SERVERS
 encapsulation dot1Q 20
 ip address 10.20.0.1 255.255.255.0
!
ip route 0.0.0.0 0.0.0.0 10.0.0.1
!
ip dhcp excluded-address 10.10.0.1 10.10.0.10
ip dhcp excluded-address 10.20.0.1 10.20.0.10
!
ip dhcp pool VLAN10
 network 10.10.0.0 255.255.255.0
 default-router 10.10.0.1
 dns-server 1.1.1.1
!
ip dhcp pool VLAN20
 network 10.20.0.0 255.255.255.0
 default-router 10.20.0.1
 dns-server 1.1.1.1
!
! Optional branch route for the c1710 extension:
! ip route 10.31.0.0 255.255.255.0 10.30.0.2
!
end
write memory
