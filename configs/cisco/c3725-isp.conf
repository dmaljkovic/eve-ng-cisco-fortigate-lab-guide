hostname ISP
no ip domain-lookup
!
interface Loopback0
 description INTERNET-STANDIN
 ip address 8.8.8.8 255.255.255.255
!
interface FastEthernet0/0
 description TO-FGT-WAN
 ip address 203.0.113.1 255.255.255.252
 no shutdown
!
! Optional return routes for testing without NAT on the FortiGate.
! With NAT enabled, the FortiGate translates the LAN sources and these are
! not required.
!
! ip route 192.168.10.0 255.255.255.0 203.0.113.2
! ip route 10.10.0.0 255.255.255.0 203.0.113.2
! ip route 10.20.0.0 255.255.255.0 203.0.113.2
!
end
write memory
