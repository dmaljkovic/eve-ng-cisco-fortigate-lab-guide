config system interface
    edit "port1"
        set mode static
        set ip 203.0.113.2 255.255.255.252
        set allowaccess ping
    next
    edit "port2"
        set mode static
        set ip 10.0.0.1 255.255.255.252
        set allowaccess ping https ssh
    next
end

config router static
    edit 1
        set gateway 203.0.113.1
        set device "port1"
    next
    edit 2
        set dst 10.10.0.0 255.255.255.0
        set gateway 10.0.0.2
        set device "port2"
    next
    edit 3
        set dst 10.20.0.0 255.255.255.0
        set gateway 10.0.0.2
        set device "port2"
    next
end

config system dns
    set primary 1.1.1.1
    set secondary 8.8.8.8
end

config firewall policy
    edit 1
        set name "LAN-to-WAN"
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
end
